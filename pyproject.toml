[project]
name = "juno-core"
version = "0.1.0"
description = "Wake-word-free addressee detection for a voice assistant: decides whether an utterance was meant for it, not what to do about it. BYOK, BYO speech-to-text, BYO agent."
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "sounddevice>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local, offline speech-to-text (see README). mlx on Apple Silicon (runs on
# the GPU), faster-whisper everywhere else.
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
faster-whisper = ["faster-whisper>=1.0"]
# Anything that talks to a cloud API over plain HTTPS (OpenAI Whisper/TTS,
# any adapter you write against a REST endpoint) needs this.
http = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["juno_core*"]
